spring.application.name=university-db-app
spring.config.import=optional:classpath:secrets.properties
# ---- MySQL connection (XAMPP defaults: user root, empty password) ---- 
# The database "university_db" is created by YOU with sql/schema.sql (not by Spring Boot) 
spring.datasource.url=jdbc:mysql://localhost:3306/university_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
  
# ---- JPA / Hibernate ---- 
# validate = only CHECK that the entities match the existing tables. Never change the schema. 
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false